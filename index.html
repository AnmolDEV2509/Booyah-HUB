<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booyah HUB - eSports Tournaments</title>
    <!-- FontAwesome & Styles -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-orange: #f97316;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --green-glow: #22c55e;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding-bottom: 70px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin: 10px;
        }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin: 15px 10px 5px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: var(--accent-orange);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
        .btn-success {
            background: var(--green-glow) !important;
        }
        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal-sheet {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            border-top: 1px solid var(--border-color);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            font-size: 12px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- Main App Container -->
    <div id="appContainer"></div>

    <!-- Withdrawal Modal Sheet -->
    <div id="withdrawModal" class="modal-overlay">
        <div class="modal-sheet">
            <div class="modal-header">
                <div>
                    <h3>Withdraw Winning Money</h3>
                    <span style="font-size:11px; color:var(--accent-orange); font-weight:700;">TRANSFER TO UPI / PAYTM</span>
                </div>
                <i class="fa-solid fa-xmark" style="font-size:20px; cursor:pointer;" onclick="window.closeModal('withdrawModal')"></i>
            </div>

            <div class="form-group">
                <label>Withdrawal Amount (₹)</label>
                <input type="number" id="withdrawAmountInput" placeholder="Minimum ₹50" min="50">
            </div>

            <div class="form-group">
                <label>Your UPI ID / PhonePe / GPay Number</label>
                <input type="text" id="withdrawUpiInput" placeholder="e.g. username@oksbi">
            </div>

            <button class="btn-primary btn-success" onclick="window.submitWithdrawalRequest()">Request Withdrawal</button>
        </div>
    </div>

    <!-- Firebase & Custom Logic Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, getDoc, getDocs, addDoc, updateDoc, query, where, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase config yahan aapka aayega
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = null; // App keauth state se set hoga
        let activePage = 'Wallet'; // Default view demo ke liye
        let currentMatchToJoin = null;
        let selectedMatchMode = 'SOLO';
        let tournamentsData = [];
        let userJoinedMatches = new Set();

        // Page Renderer Example
        window.renderCurrentPage = () => {
            const content = document.getElementById('appContainer');
            if(activePage === 'Wallet') {
                content.innerHTML = `
                    <div class="section-title"><i class="fa-solid fa-wallet"></i> My Wallet</div>
                    <div class="card" style="text-align: center; padding: 25px 20px;">
                        <span style="color: var(--text-muted); font-size: 11px; text-transform: uppercase;">Current Balance</span>
                        <h1 style="font-size: 36px; margin: 8px 0;" id="userWalletBalance">₹ 0.00</h1>
                        <div style="display:flex; gap:10px; margin-top:15px;">
                            <button class="btn-primary" onclick="window.openDepositModal()">Deposit Money</button>
                            <button class="btn-secondary" onclick="window.openWithdrawModal()">Withdraw</button>
                        </div>
                    </div>

                    <div class="section-title" style="margin-top:20px;"><i class="fa-solid fa-history"></i> Recent Transactions</div>
                    <div class="card" style="padding: 12px 15px;" id="transactionHistoryList">
                        <div style="font-size:12px; color:var(--text-muted); text-align:center;">Loading transactions...</div>
                    </div>
                `;
                window.loadUserTransactions();
            }
        };

        // Modal Control Helpers
        window.closeModal = (modalId) => {
            document.getElementById(modalId).classList.remove('active');
        };

        window.openWithdrawModal = () => {
            if (!currentUser) {
                alert("Pehle Login karein!");
                return;
            }
            document.getElementById('withdrawModal').classList.add('active');
        };

        window.openDepositModal = () => {
            alert("Deposit Modal open function yahan call hoga.");
        };

        window.showToast = (msg) => {
            console.log("Toast: ", msg);
        };

        // Submit Withdrawal Request
        window.submitWithdrawalRequest = async () => {
            const amount = parseFloat(document.getElementById('withdrawAmountInput').value);
            const upiId = document.getElementById('withdrawUpiInput').value.trim();

            if (!amount || amount < 50) {
                alert("Minimum withdrawal amount ₹50 hai!");
                return;
            }
            if (!upiId) {
                alert("Kripya apni valid UPI ID enter karein!");
                return;
            }

            try {
                window.showToast("Processing withdrawal...");

                const userRef = doc(db, "users", currentUser.uid);
                const userSnap = await getDoc(userRef);
                const currentBalance = userSnap.exists() ? (userSnap.data().walletBalance || 0) : 0;

                if (currentBalance < amount) {
                    alert("Wallet mein itna balance nahi hai!");
                    return;
                }

                await updateDoc(userRef, {
                    walletBalance: increment(-amount)
                });

                await addDoc(collection(db, "withdrawals"), {
                    userId: currentUser.uid,
                    userEmail: currentUser.email,
                    amount: amount,
                    upiId: upiId,
                    status: "PENDING",
                    createdAt: serverTimestamp()
                });

                window.closeModal('withdrawModal');
                alert("Withdrawal request successfully submit ho gayi hai!");
                document.getElementById('withdrawAmountInput').value = "";
                document.getElementById('withdrawUpiInput').value = "";
            } catch (err) {
                alert("Error: " + err.message);
            }
        };

        // Confirm Join Match with Wallet Deduction
        window.confirmJoin = async () => {
            let playerCounts = 1;
            if (selectedMatchMode === 'DUO') playerCounts = 2;
            else if (selectedMatchMode === 'SQUAD' || selectedMatchMode === 'CS') playerCounts = 4;

            let playersDataArr = [];
            for(let i = 1; i <= playerCounts; i++) {
                const ign = document.getElementById(`p_ign_${i}`)?.value.trim();
                const uid = document.getElementById(`p_uid_${i}`)?.value.trim();

                if(!ign || !uid) {
                    alert(`Please enter valid details for Player ${i}`);
                    return;
                }
                playersDataArr.push({ ign, uid });
            }

            try {
                const tourneyRef = doc(db, "tournaments", currentMatchToJoin);
                const userRef = doc(db, "users", currentUser.uid);
                const userSnap = await getDoc(userRef);
                const currentBalance = userSnap.exists() ? (userSnap.data().walletBalance || 0) : 0;
                
                const targetTourney = tournamentsData.find(t => t.id === currentMatchToJoin);
                const entryFee = targetTourney ? parseFloat(targetTourney.entry || 0) : 0;

                if (currentBalance < entryFee) {
                    alert("Wallet mein sufficient balance nahi hai! Pehle deposit karein.");
                    window.openDepositModal();
                    return;
                }

                await updateDoc(userRef, {
                    walletBalance: increment(-entryFee)
                });

                await addDoc(collection(db, "registrations"), {
                    tournamentId: currentMatchToJoin,
                    userId: currentUser.uid,
                    userEmail: currentUser.email,
                    players: playersDataArr,
                    joinedAt: serverTimestamp()
                });

                await updateDoc(tourneyRef, {
                    joinedSlots: increment(1)
                });

                userJoinedMatches.add(currentMatchToJoin);
                window.closeModal('joinModal');
                window.showToast("Successfully Registered & Fee Deducted!");
            } catch (err) {
                alert("Registration Failed: " + err.message);
            }
        };

        // Load Transactions History
        window.loadUserTransactions = async () => {
            const listEl = document.getElementById('transactionHistoryList');
            if (!listEl || !currentUser) return;

            try {
                const q = query(collection(db, "deposit_requests"), where("userId", "==", currentUser.uid));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    listEl.innerHTML = `<div style="font-size:11px; color:var(--text-muted); text-align:center;">No recent transactions found.</div>`;
                    return;
                }

                listEl.innerHTML = "";
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    listEl.innerHTML += `
                        <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border-color); font-size:12px;">
                            <div>
                                <strong>Deposit Request</strong><br>
                                <span style="font-size:10px; color:var(--text-muted);">UTR: ${data.utrNumber}</span>
                            </div>
                            <div style="text-align:right;">
                                <span style="color:var(--green-glow); font-weight:700;">+₹${data.amount}</span><br>
                                <span style="font-size:10px; color:${data.status === 'APPROVED' ? 'var(--green-glow)' : 'var(--accent-orange)'};">${data.status}</span>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                console.error("Error loading transactions:", e);
            }
        };

        // Initial render call
        window.renderCurrentPage();
    </script>
</body>
</html>
