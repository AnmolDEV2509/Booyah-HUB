<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booyah HUB - Esports Tournament Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">BOOYAH HUB</div>
        <div class="nav-links">
            <span id="userWallet">Balance: ₹0</span>
            <button id="authBtn" onclick="toggleAuth()">Login</button>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <h2>Available Tournaments</h2>
        <div id="tournamentList" class="tournament-grid">
            <!-- Dynamic Tournaments Rendered Here -->
        </div>
    </div>

    <!-- Registration Modal -->
    <div id="joinModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('joinModal')">&times;</span>
            <h3>Register for Tournament</h3>
            <div id="modalPlayerInputs">
                <!-- Dynamic Player Inputs Based on Mode -->
            </div>
            <button class="btn-submit" onclick="confirmJoin()">Confirm & Pay Entry Fee</button>
        </div>
    </div>

    <!-- Firebase & Main App Script -->
    <script type="module" src="app.js"></script>
</body>
</html>
