<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booyah HUB Arena</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-orange: #ff4500;
            --green-glow: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            padding-bottom: 80px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-orange);
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #ff4500, #ff6b00);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-secondary {
            width: 100%;
            background: rgba(255,255,255,0.1);
            color: var(--text-main);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669) !important;
        }

        /* Modal Sheet UI */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-sheet {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 24px 24px 0 0;
            padding: 25px 20px;
            box-sizing: border-box;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
        }

        .chip {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            flex: 1;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff4500;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: none;
            z-index: 2000;
            box-shadow: 0 4px 15px rgba(255,69,0,0.4);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- WALLET PAGE -->
        <div class="section-title"><i class="fa-solid fa-wallet"></i> My Wallet</div>
        
        <div class="card" style="text-align: center; padding: 25px 20px;">
            <span style="color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px;">Current Balance</span>
            <h1 style="font-size: 38px; margin: 10px 0; color: #fff;" id="userWalletBalance">₹ 0.00</h1>
            
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn-primary" onclick="window.openDepositModal()">Deposit Money</button>
                <button class="btn-secondary" onclick="window.showToast('Withdrawal Feature Coming Soon!')">Withdraw</button>
            </div>
        </div>
    </div>

    <!-- STEP 1: DEPOSIT MODAL SHEET -->
    <div id="depositModal" class="modal-overlay">
        <div class="modal-sheet">
            <div class="modal-header">
                <div>
                    <h3>Deposit via Payment App</h3>
                    <span style="font-size:11px; color:var(--accent-orange); font-weight:700;">GPay / PhonePe / Paytm / BHIM</span>
                </div>
                <i class="fa-solid fa-xmark" style="font-size:20px; cursor:pointer;" onclick="window.closeModal('depositModal')"></i>
            </div>

            <div class="form-group">
                <label>Enter Amount (₹)</label>
                <input type="number" id="depositAmountInput" placeholder="Minimum ₹10" min="10" value="100">
            </div>

            <!-- Quick Chips -->
            <div style="display: flex; gap: 8px; margin-bottom: 20px;">
                <button class="chip" onclick="document.getElementById('depositAmountInput').value = 50">+ ₹50</button>
                <button class="chip" onclick="document.getElementById('depositAmountInput').value = 100">+ ₹100</button>
                <button class="chip" onclick="document.getElementById('depositAmountInput').value = 200">+ ₹200</button>
                <button class="chip" onclick="document.getElementById('depositAmountInput').value = 500">+ ₹500</button>
            </div>

            <button class="btn-primary" onclick="window.startDirectUpiPayment()">Open Mobile Payment App</button>
        </div>
    </div>

    <!-- STEP 2: UTR VERIFICATION MODAL SHEET -->
    <div id="verifyUpiModal" class="modal-overlay">
        <div class="modal-sheet">
            <div class="modal-header">
                <div>
                    <h3>Verify Payment</h3>
                    <span style="font-size:11px; color:var(--green-glow); font-weight:700;">ENTER 12-DIGIT UTR / REF NUMBER</span>
                </div>
                <i class="fa-solid fa-xmark" style="font-size:20px; cursor:pointer;" onclick="window.closeModal('verifyUpiModal')"></i>
            </div>

            <p style="font-size: 12px; color: var(--text-muted); margin-top: -10px; margin-bottom: 15px;">
                Payment app me success hone ke baad wahan se 12-digit UTR/Ref ID copy karke yahan submit karein.
            </p>

            <div class="form-group">
                <label>12-Digit UTR / Transaction Ref No.</label>
                <input type="text" id="upiUtrInput" maxlength="12" placeholder="e.g. 324156789012">
            </div>

            <button class="btn-primary btn-success" onclick="window.submitUpiVerification()">Submit for Admin Approval</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Notification Message</div>

    <!-- Firebase Configuration & Logic Module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Config (Aapki config details yahan rhengi)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentPendingAmount = 0;

        // UI Toast Helper
        window.showToast = (msg) => {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        };

        // Modal Controls
        window.closeModal = (modalId) => {
            document.getElementById(modalId).classList.remove('active');
        };

        window.openDepositModal = () => {
            if (!currentUser) {
                alert("Pehle Login karein!");
                return;
            }
            document.getElementById('depositModal').classList.add('active');
        };

        // Auth & Wallet Live Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                // Live Wallet Balance Fetching
                onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                    if (docSnap.exists()) {
                        const val = docSnap.data().walletBalance || 0;
                        document.getElementById('userWalletBalance').innerText = `₹ ${parseFloat(val).toFixed(2)}`;
                    }
                });
            } else {
                currentUser = null;
                document.getElementById('userWalletBalance').innerText = "₹ 0.00";
            }
        });

        // 1. Direct Payment App Intent Link Trigger
        window.startDirectUpiPayment = () => {
            const amountVal = parseFloat(document.getElementById('depositAmountInput').value);

            if (!amountVal || amountVal < 10) {
                alert("Bhai kam se kam ₹10 enter karo!");
                return;
            }

            currentPendingAmount = amountVal;

            // ⚠️ APNI PERSONAL YA BUSINESS UPI ID YAHAN PASTE KAREIN
            const adminUpiId = "yourupiid@okaxis"; 
            const payeeName = "Booyah HUB Esports";

            // Universal Mobile UPI Deep Link Format
            const upiDeepLink = `upi://pay?pa=${adminUpiId}&pn=${encodeURIComponent(payeeName)}&am=${amountVal}&cu=INR&tn=BooyahHub_Wallet_Deposit`;

            // Mobile Browser direct payment selector open karega
            window.location.href = upiDeepLink;

            // Deposit sheet close karke UTR Submit Sheet khol dega
            window.closeModal('depositModal');
            setTimeout(() => {
                document.getElementById('verifyUpiModal').classList.add('active');
            }, 1200);
        };

        // 2. Submit UTR to Firestore for Admin Verification
        window.submitUpiVerification = async () => {
            const utrVal = document.getElementById('upiUtrInput').value.trim();

            if (utrVal.length < 12) {
                alert("Kripya sahi 12-digit UTR / Ref Number enter karein!");
                return;
            }

            try {
                window.showToast("Submitting payment...");

                // Firestore collection "deposit_requests" me store hoga
                await addDoc(collection(db, "deposit_requests"), {
                    userId: currentUser.uid,
                    userEmail: currentUser.email,
                    amount: currentPendingAmount,
                    utrNumber: utrVal,
                    status: "PENDING",
                    createdAt: serverTimestamp()
                });

                window.closeModal('verifyUpiModal');
                alert("Deposit Request Submit Ho Gayi! Admin verify karke jald hi balance add kar dega.");
                document.getElementById('upiUtrInput').value = "";
            } catch (err) {
                alert("Submission Error: " + err.message);
            }
        };
    </script>
</body>
</html>
